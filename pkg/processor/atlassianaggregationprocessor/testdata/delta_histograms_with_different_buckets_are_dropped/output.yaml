resourceMetrics:
  - schemaUrl: https://test-res-schema.com/schema
    resource:
      attributes:
        - key: asdf
          value:
            stringValue: foo
    scopeMetrics:
      - schemaUrl: https://test-scope-schema.com/schema
        scope:
          name: MyTestInstrument
          version: "1.2.3"
          attributes:
            - key: foo
              value:
                stringValue: bar
        metrics:
          - name: cumulative.histogram.test
            histogram:
              aggregationTemporality: 1
              dataPoints:
                - timeUnixNano: 90
                  explicitBounds: [1, 10, 100]
                  bucketCounts: [1, 1, 2]
                  attributes:
                    - key: aaa
                      value:
                        stringValue: bbb
